[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-omega-portable"
version = "0.2.0"
description = "Isolated local replay of preserved OMEGA numerical kernels"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.17.0"]

[project.scripts]
invariant-omega = "invariant_omega.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["invariant_omega*"]

[tool.setuptools.package-data]
invariant_omega = ["_frozen/**/*", "_frozen/*", "reference_results/*", "_frozen_hashes.json"]
